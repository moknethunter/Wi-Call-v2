name: Build Wi-Call APK with EasyTier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory:
    name: Test Internet directory and site routes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r directory/requirements.txt
      - run: PYTHONPATH=directory python -m unittest discover -s directory/tests -v
      - run: python -m unittest discover -s deploy -v

  android:
    needs: directory
    name: Test and assemble debug APK with EasyTier
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Clone EasyTier source
        run: |
          git clone --depth 1 https://github.com/EasyTier/EasyTier.git /tmp/EasyTier
          cd /tmp/EasyTier
          git submodule update --init --recursive

      - name: Build EasyTier FFI and JNI libraries
        shell: bash
        run: |
          cd /tmp/EasyTier/easytier-contrib/easytier-ffi
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target i686-linux-android
          cargo build --release --target x86_64-linux-android
          cd ../easytier-android-jni
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target i686-linux-android
          cargo build --release --target x86_64-linux-android

      - name: Copy native libraries to jniLibs
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            case $abi in
              arm64-v8a)   target=aarch64-linux-android ;;
              armeabi-v7a) target=armv7-linux-androideabi ;;
              x86)         target=i686-linux-android ;;
              x86_64)      target=x86_64-linux-android ;;
            esac
            mkdir -p app/src/main/jniLibs/$abi
            cp /tmp/EasyTier/target/$target/release/libeasytier_ffi.so app/src/main/jniLibs/$abi/ 2>/dev/null || true
            cp /tmp/EasyTier/target/$target/release/libeasytier_android_jni.so app/src/main/jniLibs/$abi/
          done

      - name: Verify minSdkVersion is compatible with Android 10
        shell: bash
        run: |
          min_sdk=$(grep -oP 'minSdkVersion\s*=\s*\K[0-9]+' app/build.gradle || true)
          if [ -z "$min_sdk" ]; then
            echo "minSdkVersion not found in app/build.gradle"
            exit 1
          fi
          echo "Detected minSdkVersion: $min_sdk"
          if [ "$min_sdk" -gt 29 ]; then
            echo "::error::minSdkVersion ($min_sdk) is greater than 29. The APK will not install on Android 10."
            exit 1
          fi
          echo "minSdkVersion is compatible with Android 10."

      - name: Verify JVM contracts, Android lint, and Android 10 behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: env -u GRADLE_HOME ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:connectedDebugAndroidTest

      - name: Assemble the verified APK
        run: env -u GRADLE_HOME ./gradlew --no-daemon :assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Call-Test-Reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Call-Debug-with-EasyTier
          path: build/outputs/apk/Wi-Call-Debug.apk
          if-no-files-found: error
          retention-days: 14
