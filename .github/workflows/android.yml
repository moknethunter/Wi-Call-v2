name: Build Wi-Call APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory:
    name: Test Internet directory and site routes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r directory/requirements.txt
      - run: PYTHONPATH=directory python -m unittest discover -s directory/tests -v
      - run: python -m unittest discover -s deploy -v

  easytier:
    name: Build EasyTier JNI (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Rust, Android NDK, and protobuf compiler
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup run 1.95 cargo install cargo-ndk --version 4.1.2 --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
      - name: Compile EasyTier
        run: tools/build-easytier-android.sh '${{ matrix.abi }}' "$RUNNER_TEMP/easytier"
      - uses: actions/upload-artifact@v4
        with:
          name: easytier-${{ matrix.abi }}
          path: ${{ runner.temp }}/easytier
          if-no-files-found: error

  android:
    needs: [directory, easytier]
    name: Test and assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: easytier-*
          merge-multiple: true
          path: app/src/main/jniLibs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Android SDK 35 available
        shell: bash
        run: |
          sdk="${ANDROID_HOME:?Android SDK is unavailable on this runner}"
          if [[ ! -f "$sdk/platforms/android-35/android.jar" || ! -x "$sdk/build-tools/35.0.0/aapt2" ]]; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify JVM contracts, Android lint, and Android 10 behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: env -u GRADLE_HOME ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:connectedDebugAndroidTest

      - name: Assemble the verified APK
        run: env -u GRADLE_HOME ./gradlew --no-daemon :assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Call-Test-Reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wi-Call-Debug
          path: build/outputs/apk/Wi-Call-Debug.apk
          if-no-files-found: error
          retention-days: 14
